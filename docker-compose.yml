version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kampusrota-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=KampusRota_2026!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql/data
    networks:
      - kampusrota-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kampusrota-api
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=KampusRotaDb;User Id=sa;Password=KampusRota_2026!;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "7107:8080"
    depends_on:
      - db
    networks:
      - kampusrota-network

volumes:
  mssql-data:

networks:
  kampusrota-network:
    driver: bridge
